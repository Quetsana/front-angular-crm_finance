name: CI/CD Front Angular CRM Finance

on:
  push:
    branches: ['main']

jobs:
  # ── JOB 1: Build ──────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── JOB 2: Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "--- 📂 PREPARANDO DIRECTORIO ---"
            mkdir -p /home/front-angular-crm-finance
            cd /home/front-angular-crm-finance

            echo "--- 🔄 ACTUALIZANDO CÓDIGO ---"
            if [ ! -d ".git" ]; then
                git clone https://github.com/${{ github.repository }}.git .
            else
                git fetch origin main
                git reset --hard origin/main
            fi

            echo "--- 🔐 VARIABLES DE ENTORNO ---"
            cat > .env << 'ENVEOF'
            APP_NAME=${{ secrets.APP_NAME }}
            APP_VERSION=${{ secrets.APP_VERSION }}
            NODE_ENV=production
            HOST=0.0.0.0
            PORT=4200
            ENVEOF

            echo "--- 🐳 DESPLEGANDO CON DOCKER ---"
            DOCKER_API_VERSION=1.41 docker compose down
            DOCKER_API_VERSION=1.41 docker compose up -d --build

            echo "--- ⏳ ESPERANDO QUE LA APP ESTÉ LISTA ---"
            for i in $(seq 1 20); do
                if curl -sf http://localhost:4200 > /dev/null 2>&1; then
                    echo "✅ App funcionando en intento $i"
                    break
                fi
                echo "  Intento $i/20, esperando 3s..."
                sleep 3
            done

            echo "--- 🧹 LIMPIEZA ---"
            docker image prune -a -f
            docker container prune -f

            echo "--- 📊 ESTADO FINAL ---"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "✅ DEPLOY EXITOSO"
